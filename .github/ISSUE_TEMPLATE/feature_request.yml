name: Feature request
description: Describe a problem, proposed behavior, and testable acceptance criteria.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult today? Include platform or Copilot version constraints if relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and what is out of scope. Use synthetic examples, not real notifications.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that an implementation and its tests must satisfy.
    validations:
      required: true
