version: 2
multi-ecosystem-groups:
  development:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /ci/actionlint
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ci/playwright
    patterns: ["playwright"]
    multi-ecosystem-group: development
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: development
    allow:
      - dependency-type: development
