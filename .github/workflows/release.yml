name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"
  checks:
    needs: validate
    uses: ./.github/workflows/tests.yml
  release:
    needs: [validate, checks]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate release tag
        run: node scripts/check-release.mjs "$RELEASE_TAG"
      - name: Install pinned build tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build release package
        run: node scripts/build-release.mjs "$RELEASE_TAG"
      - name: Test the packaged installation and runtime
        run: node --test test/package.integration.mjs
      - name: Publish tested package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG"
