name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require a commit from protected main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"
  checks:
    needs: validate
    uses: ./.github/workflows/tests.yml
  build:
    needs: [validate, checks]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate release tag
        run: node scripts/check-release.mjs "$RELEASE_TAG"
      - name: Install pinned build tools
        run: npm ci --ignore-scripts --no-audit --no-fund --engine-strict
      - name: Build release package
        run: node scripts/build-release.mjs "$RELEASE_TAG"
      - name: Test the packaged installation and runtime
        run: node --test test/package.integration.mjs
      - name: Attest the exact tested release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/github-notifications-${{ github.ref_name }}.tar.gz
      - name: Upload the tested release package
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: |
            dist/github-notifications-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [validate, build]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
      attestations: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Download the exact tested artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist
          digest-mismatch: error
      - name: Publish tested package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG"
