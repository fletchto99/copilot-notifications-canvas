name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-slim
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: macos-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run tests with source coverage
        if: matrix.node == '22'
        run: npm run test:coverage
        env:
          COVERAGE_BADGE_PATH: ${{ runner.temp }}/coverage.svg
      - name: Upload measured coverage badge
        if: matrix.node == '22' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/coverage.svg
          if-no-files-found: error
          retention-days: 7
      - name: Run tests
        if: matrix.node != '22'
        run: npm test
      - name: Install isolated Linux notification test tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dbus-daemon libnotify-bin python3-dbus python3-gi
      - name: Test real notify-send against a private fake notification service
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:notifications:linux
  windows:
    name: Node.js 24 (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Test Windows installation, settings, locks and native toast construction
        run: node --test test/platform.test.mjs test/lock.test.mjs test/settings.test.mjs test/notifier.test.mjs
      - name: Test Windows notification destinations and workflow resolution
        run: node --test --test-name-pattern="Windows|individual desktop alerts" test/desktop.test.mjs
  lint:
    name: Lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit --engine-strict
      - name: Lint JavaScript
        run: npm run lint:js
      - name: Lint CSS with Stylelint
        run: npm run lint:css
      - name: Check CSS formatting with Prettier
        run: npm run format:css:check
      - name: Lint embedded recovery JavaScript and CSS
        run: npm run lint:recovery
      - name: Check generated Octicons match the pinned dependency
        run: npm run icons:check
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        uses: ./ci/actionlint
  browser-image:
    name: Resolve browser image
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned browser image
        id: image
        run: |
          declaration="$(< ci/playwright/Dockerfile)"
          if [[ ! "$declaration" =~ ^FROM\ (mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+-noble@sha256:[a-f0-9]{64})$ ]]; then
            echo "Invalid pinned Playwright image" >&2
            exit 1
          fi
          printf 'image=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
  browser:
    name: Browser (${{ matrix.browser }}, shard ${{ matrix.shard }}/4)
    needs: browser-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.browser-image.outputs.image }}
      options: --init --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow Git access to the mounted checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit --engine-strict
      - name: Validate release packaging
        run: |
          npm run build
          npm run test:package
      - name: Run browser and accessibility tests
        run: npm run test:browser -- --project="${{ matrix.browser }}" --shard="${{ matrix.shard }}/4"
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: error
  browser-check:
    name: Browser tests
    needs: browser
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Require every browser shard to pass
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "Browser shard result: $BROWSER_RESULT"
          test "$BROWSER_RESULT" = success
